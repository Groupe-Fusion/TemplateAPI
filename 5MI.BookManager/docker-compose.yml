services:
  book_db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: book_db
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=7.b63QwR2JBZ
    ports:
      - "1433:1433"
    networks:
      - sql_network
    volumes:
      - sql_data:/var/opt/mssql
    
  member_service:
    build:
      context: ./members-service
      dockerfile: Dockerfile
    container_name: member_service_container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=book_db,1433;Database=BookManager;User Id=sa;Password=7.b63QwR2JBZ;Encrypt=False;
    ports:
      - "8081:8080"
    depends_on:
      - book_db
    networks:
      - sql_network

  book_service:
    build:
      context: ./books-service
      dockerfile: Dockerfile
    container_name: book_service_container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=book_db,1433;Database=BookManager;User Id=sa;Password=7.b63QwR2JBZ;Encrypt=False;
    ports:
      - "8082:8080"
    depends_on:
      - book_db
    networks:
      - sql_network

  reservation_service:
    build:
      context: ./reservations-service
      dockerfile: Dockerfile
    container_name: reservation_service_container
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ExternalServices__BookService__Url=http://localhost:8082/
      - ExternalServices__MemberService__Url=http://localhost:8081/
      - ConnectionStrings__Default=Server=book_db,1433;Database=BookManager;User Id=sa;Password=7.b63QwR2JBZ;Encrypt=False;
    ports:
      - "8080:8080"
    depends_on:
      - book_db
      - member_service
      - book_service
    networks:
      - sql_network

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9000:9000"
    networks:
      - sql_network

networks:
  sql_network:
    driver: bridge

volumes:
  sql_data: